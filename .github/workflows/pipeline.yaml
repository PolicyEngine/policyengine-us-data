name: Run Pipeline

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU type for regional calibration"
        default: "T4"
        type: string
      epochs:
        description: "Epochs for regional calibration"
        default: "1000"
        type: string
      national_epochs:
        description: "Epochs for national calibration"
        default: "1000"
        type: string
      num_workers:
        description: "Number of parallel H5 workers"
        default: "50"
        type: string
      skip_national:
        description: "Skip national calibration/H5"
        default: false
        type: boolean
      resume_run_id:
        description: "Resume a failed run by ID (allows mixed provenance)"
        default: ""
        type: string
      version_override:
        description: "Override version (default: read from pyproject.toml)"
        default: ""
        type: string
      publication_id:
        description: "Publication ID to use across GitHub, Modal, and HF staging"
        default: ""
        type: string
      source_sha:
        description: "Exact policyengine-us-data commit SHA to deploy"
        default: ""
        type: string

concurrency:
  group: pipeline-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      MODAL_ENVIRONMENT: main
      US_DATA_MODAL_APP_PREFIX: policyengine-us-data-pub
      US_DATA_PUBLICATION_ID: ${{ inputs.publication_id || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Modal Runner Deps
        run: pip install modal pandas

      - name: Resolve publication context
        id: publication-context
        run: python .github/scripts/resolve_publication_context.py

      - name: Deploy and launch pipeline on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PIPELINE_BRANCH: main
          GPU: ${{ inputs.gpu || 'T4' }}
          EPOCHS: ${{ inputs.epochs || '1000' }}
          NATIONAL_EPOCHS: ${{ inputs.national_epochs || '1000' }}
          NUM_WORKERS: ${{ inputs.num_workers || '50' }}
          SKIP_NATIONAL: ${{ inputs.skip_national || 'false' }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id || '' }}
          VERSION_OVERRIDE: ${{ inputs.version_override || '' }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          modal deploy --env="${MODAL_ENVIRONMENT}" --name="${MODAL_APP_NAME}" --tag="${PUBLICATION_ID}" modal_app/pipeline.py
          python .github/scripts/spawn_modal_pipeline.py
