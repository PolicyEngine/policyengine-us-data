name: PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Check if PR is from fork
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "::error::PRs must be from branches in PolicyEngine/policyengine-us-data, not forks."
            exit 1
          fi

  check-lock-freshness:
    runs-on: ubuntu-latest
    needs: check-fork
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Check lock file is up-to-date
        run: |
          uv lock --locked || {
            echo "::error::uv.lock is outdated. Run 'uv lock' and commit."
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    needs: check-fork
    steps:
      - uses: actions/checkout@v6
      - run: pip install ruff>=0.9.0
      - run: ruff format --check .

  quality-guards:
    name: Quality guards
    runs-on: ubuntu-latest
    needs: check-fork
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Run quality guards
        run: python scripts/run_quality_guards.py

  check-changelog:
    runs-on: ubuntu-latest
    needs: check-fork
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --dev
      - name: Check for changelog fragment
        run: uv run towncrier check --compare-with origin/main

  unit-tests:
    runs-on: ubuntu-latest
    needs: [check-fork, lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --dev
      - name: Run unit tests with coverage
        env:
          HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
        run: >
          uv run pytest tests/unit/
          --cov=policyengine_us_data
          --cov-report=xml
          -v
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unit
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  target-integration-tests:
    runs-on: ubuntu-latest
    needs: [check-fork, lint, unit-tests, smoke-test, decide-test-scope]
    if: needs.decide-test-scope.outputs.run_integration == 'true'
    name: Integration tests
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
      MODAL_ENVIRONMENT: staging-us-data-pr-${{ github.event.pull_request.number }}
      MODAL_APP_NAME: policyengine-us-data-pipeline
      MODAL_LOCAL_AREA_APP_NAME: policyengine-us-data-local-area
      MODAL_H5_TEST_HARNESS_APP_NAME: policyengine-us-data-h5-test-harness
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --dev
      - name: Install integration test deps
        run: uv pip install modal pytest numpy pandas
      - name: Ensure PR Modal environment exists
        run: uv run python .github/scripts/ensure_modal_environment.py
      - name: Sync Modal secrets to PR environment
        run: uv run python .github/scripts/sync_modal_secrets.py
      - name: Deploy Modal pipeline app to PR staging
        run: uv run modal deploy --env="${MODAL_ENVIRONMENT}" modal_app/pipeline.py
      - name: Deploy Modal local-area app to PR staging
        run: uv run modal deploy --env="${MODAL_ENVIRONMENT}" modal_app/local_area.py
      - name: Deploy Modal H5 test harness to PR staging
        run: uv run modal deploy --env="${MODAL_ENVIRONMENT}" modal_app/h5_test_harness.py
      - name: Run integration tests
        run: >
          uv run pytest
          tests/integration/test_tiny_pipeline_workspace.py
          tests/integration/test_tiny_stage_1_artifacts.py
          tests/integration/test_tiny_stage_2_artifacts.py
          tests/integration/test_tiny_stage_3_artifacts.py
          tests/integration/test_tiny_stage_4_artifacts.py
          tests/integration/test_tiny_stage_5_artifacts.py
          tests/integration/test_tiny_pipeline_e2e.py
          tests/integration/test_tiny_pipeline_h5_e2e.py
          tests/integration/local_h5/
          tests/integration/test_modal_pipeline_seams.py
          tests/integration/test_tiny_h5_pipeline.py
          tests/integration/test_modal_pipeline_e2e.py
          -v
      - name: Cleanup PR Modal environment
        if: always()
        run: uv run python .github/scripts/delete_modal_environment.py

  smoke-test:
    runs-on: ubuntu-latest
    needs: [check-fork, lint]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install .
      - run: python .github/scripts/check_python_import.py policyengine_us_data
      - run: python .github/scripts/check_python_import.py policyengine_core.data:Dataset

  docs-build:
    runs-on: ubuntu-latest
    needs: [check-fork]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --dev
      - name: Test documentation builds
        run: uv run make documentation

  decide-test-scope:
    runs-on: ubuntu-latest
    needs: check-fork
    outputs:
      run_integration: ${{ steps.check.outputs.run_integration }}
      run_long_term_smoke: ${{ steps.check.outputs.run_long_term_smoke }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check changed files for integration scope
        id: check
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          if echo "$CHANGED" | grep -qE '^(\.github/scripts/|\.github/workflows/pr\.yaml|modal_app/|policyengine_us_data/|tests/integration/|tests/support/|pyproject\.toml|uv\.lock)'; then
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_integration=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(\.github/workflows/(pr|pipeline)\.yaml|policyengine_us_data/datasets/cps/long_term/|policyengine_us_data/storage/long_term_target_sources/|tests/unit/test_long_term_calibration_contract\.py)'; then
            echo "run_long_term_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_long_term_smoke=false" >> "$GITHUB_OUTPUT"
          fi

  long-term-projection-smoke:
    name: Long-term 2100 smoke build
    runs-on: ubuntu-latest
    needs: [check-fork, lint, unit-tests, smoke-test, decide-test-scope]
    if: needs.decide-test-scope.outputs.run_long_term_smoke == 'true'
    timeout-minutes: 120
    env:
      HUGGING_FACE_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --dev
      - name: Run 2100 long-term projection smoke build
        run: |
          OUTPUT_DIR="${RUNNER_TEMP}/long-term-projection-smoke"
          mkdir -p "${OUTPUT_DIR}"
          cd policyengine_us_data/datasets/cps/long_term
          uv run python run_household_projection.py 2100 2100 \
            --profile ss-payroll-tob \
            --target-source oact_2025_08_05_provisional \
            --support-augmentation-profile donor-backed-composite-v1 \
            --support-augmentation-target-year 2100 \
            --support-augmentation-blueprint-base-weight-scale 0.5 \
            --allow-validation-failures \
            --output-dir "${OUTPUT_DIR}" \
            --save-h5
      - name: Validate smoke build artifacts
        run: |
          OUTPUT_DIR="${RUNNER_TEMP}/long-term-projection-smoke"
          test -f "${OUTPUT_DIR}/2100.h5"
          test -f "${OUTPUT_DIR}/2100.h5.metadata.json"
          test -f "${OUTPUT_DIR}/calibration_manifest.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_dir = Path(os.environ["RUNNER_TEMP"]) / "long-term-projection-smoke"
          metadata = json.loads((output_dir / "2100.h5.metadata.json").read_text())
          manifest = json.loads((output_dir / "calibration_manifest.json").read_text())

          assert metadata["year"] == 2100
          assert metadata["target_source"]["name"] == "oact_2025_08_05_provisional"
          assert metadata["target_source"]["scenario_id"] == "crfb_post_obbba_tob_75y"
          assert metadata["tax_assumption"]["name"] == "trustees-core-thresholds-v1"
          assert manifest["years"] == [2100]
          PY
